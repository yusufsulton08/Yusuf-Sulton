<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Al-Qudwah">
<meta name="theme-color" content="#0b1f3a">
<title>Al-Qudwah Dashboard</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<script>
(function(){
  try {
    var canvas = document.createElement('canvas');
    canvas.width = 180; canvas.height = 180;
    var ctx = canvas.getContext('2d');
    if(!ctx) return;
    ctx.fillStyle = '#0b1f3a';
    ctx.fillRect(0,0,180,180);
    ctx.fillStyle = '#a8844a';
    ctx.font = 'bold 110px "Playfair Display", Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Q', 90, 98);
    var iconDataUrl = canvas.toDataURL('image/png');
    var link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = iconDataUrl;
    document.head.appendChild(link);
  } catch(e) {}
})();
</script>

<style>
:root{--bg:#f6f1e7;--card:#fffaf0;--ink:#0b1f3a;--mute:#5a6a82;--line:#e3d9c4;--hero:#0b1f3a;--hero-ink:#f6f1e7;--gold:#a8844a;--ok:#2f7d5b;--bad:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081526;--card:#0f2340;--ink:#f1ead9;--mute:#9db0c9;--line:#203b60;--hero:#16365f;--hero-ink:#f6f1e7;--gold:#d2ad73;--ok:#5fc49a;--bad:#ff8b7e}}
:root[data-theme="dark"]{--bg:#081526;--card:#0f2340;--ink:#f1ead9;--mute:#9db0c9;--line:#203b60;--hero:#16365f;--hero-ink:#f6f1e7;--gold:#d2ad73;--ok:#5fc49a;--bad:#ff8b7e}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overflow-x:hidden;max-width:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;max-width:100%;width:100%}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:70;pointer-events:none}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;font-weight:700;overflow-wrap:break-word}
.wrap{max-width:880px;width:100%;margin:0 auto;padding:20px 16px 88px;overflow-x:hidden}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:24px 26px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
.hero-left{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;min-width:0}
.hero-arabic{font-size:52px;color:var(--gold);font-family:"Playfair Display",Georgia,serif;line-height:1.05;font-weight:700;letter-spacing:0.01em}
.hero-sub{font-size:15px;color:var(--hero-ink);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;opacity:0.92}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:10px;margin-left:auto;text-align:right}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 16px;text-align:center}
.stat b{display:block;font:700 22px "Playfair Display",Georgia,serif}.stat span{font-size:12px;opacity:.8}
.tabs{overflow-x:auto;display:flex;gap:6px;margin:18px 0;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:14px;scrollbar-width:none;max-width:100%;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;white-space:nowrap;border:0;background:none;color:var(--mute);font:600 14px Inter,system-ui,sans-serif;padding:10px 14px;border-radius:10px;cursor:pointer;transition:background .2s}
.tab[aria-selected=true]{background:var(--hero);color:var(--hero-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;max-width:100%}
.card h2{font-size:21px;margin-bottom:8px}.card h3{font-size:18px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.mute{color:var(--mute);font-size:14px;margin:4px 0 0}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px}.step b{display:block;color:var(--gold);font-size:13px}.step span{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:14px 0}
.pr{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}.pr b{display:block;margin-bottom:4px}
.quote{border-left:3px solid var(--gold);margin:14px 0;padding:4px 0 4px 14px;font:italic 600 18px/1.5 "Playfair Display",Georgia,serif}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row.first{border-top:0}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin-top:2px;flex:none;border:2px solid var(--line);border-radius:6px;cursor:pointer;position:relative;background:var(--bg);transition:all .2s}
.chk:checked{border-color:var(--ok);background:rgba(47,125,91,.08)}
.chk:checked::after{content:'';position:absolute;left:7px;top:-5px;width:8px;height:20px;border:solid var(--ok);border-width:0 3px 3px 0;transform:rotate(45deg)}
.grow{flex:1;min-width:0}
.done .t{text-decoration:line-through;color:var(--mute)}
.date{font-size:12px;color:var(--gold);font-weight:600;margin-top:2px}
.hint{cursor:help;outline:none}
.hint:focus-visible{background:rgba(168,132,74,.2)}
.tip{position:fixed;z-index:80;background:var(--hero);color:var(--hero-ink);padding:10px 12px;border-radius:10px;font:400 13px/1.4 Inter,system-ui,sans-serif;font-style:normal;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.3);display:block;border:1px solid rgba(230,200,143,.4);user-select:none;-webkit-user-select:none}
.tip b{display:block;color:#e6c88f;font-size:14px;margin-bottom:2px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.btn{background:var(--hero);color:var(--hero-ink);border:0;border-radius:10px;padding:9px 16px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;margin-top:10px;transition:opacity .2s}
.btn[disabled]{opacity:.6;cursor:default}
.btn:active{opacity:.8}
.badge{display:inline-block;font-size:12px;font-weight:600;color:var(--gold)}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:20px}
.paras p{margin:10px 0 0}
.paras ::selection{background:rgba(168,132,74,.35)}
.quiz{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.mc-q{margin:16px 0 8px;font-weight:600}
.mc-opts{display:flex;flex-direction:column;gap:8px}
.mc-opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;transition:all .2s;line-height:1.4}
.mc-opt[aria-pressed="true"]{border-color:var(--gold);background:rgba(168,132,74,.1)}
.mc-opt:disabled{cursor:default;opacity:.9}
.mc-exp{margin-top:8px;padding:12px;border-radius:10px;font-size:14px;line-height:1.45}
.mc-exp.ok{background:rgba(47,125,91,.1);color:var(--ok);border:1px solid var(--ok)}
.mc-exp.bad{background:rgba(179,57,47,.08);color:var(--bad);border:1px solid var(--bad)}
.mc-exp b{display:block;margin-bottom:4px;font-size:15px}
.feature{background:var(--hero);color:var(--hero-ink);border-color:var(--hero)}
.feature .eyebrow{color:#e6c88f}
.feature .row{border-color:rgba(255,255,255,.16)}
.feature .mute,.feature .done .t{color:rgba(246,241,231,.72)}
.feature .bar{background:rgba(255,255,255,.18)}.feature .bar i{background:#e6c88f}
.feature .chk{accent-color:#e6c88f}
.feature .date{color:#e6c88f}
.feature .date.open{color:#8fd9b6}
.feature .locked .t{color:rgba(246,241,231,.62)}
.feature .lvsub{color:rgba(246,241,231,.85)}
.lvsub b{color:#e6c88f;font-weight:700;letter-spacing:.02em}
.addrow{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center;max-width:100%}
.addrow .btn,.row .btn{margin-top:0}
.txt{flex:1;min-width:0;max-width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .2s}
.txt:focus{outline:2px solid var(--gold);outline-offset:1px}
.editrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:100%}
.addrow .txt,.editrow .txt{flex:1 1 160px;min-width:0}
.addrow .txt.big,.editrow .txt.big{flex:2 1 200px;min-width:0}
.addrow .txt.sel,.editrow .txt.sel,.addrow .txt.dt,.editrow .txt.dt{flex:0 1 auto;max-width:100%;min-width:0}
.txt.dt,.txt.sel{color-scheme:light dark}
.txt.sel{cursor:pointer}
.row .editrow{width:100%}
.btn.sm{padding:7px 12px}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.tdrow{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.tdrow .t{flex:1;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex:none;align-items:center}
.lnk{background:none;border:0;color:var(--gold);font:600 13px Inter,system-ui,sans-serif;cursor:pointer;padding:2px 4px}
.lnk.del{color:var(--bad)}
.row.hi{border-left:3px solid var(--bad);padding-left:10px}
.bang{color:var(--bad)}.date.late{color:var(--bad)}
.today{border:1.5px solid var(--gold);box-shadow:0 6px 22px rgba(168,132,74,.16)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{border:1.5px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:5px 14px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;transition:all .2s}
.chip.on{background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.empty{color:var(--mute);font-size:14px;margin:12px 0 0}
.rpop{position:fixed;z-index:90;background:var(--hero);color:var(--hero-ink);border:1px solid rgba(230,200,143,.45);border-radius:14px;padding:12px 40px 12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.32);user-select:none;-webkit-user-select:none}
.rpop.sheet{left:12px !important;right:12px !important;width:auto !important;top:auto !important;bottom:calc(12px + env(safe-area-inset-bottom,0px)) !important;padding:14px 44px 14px 16px;border-radius:18px;box-shadow:0 -8px 32px rgba(0,0,0,.4)}
.rclose{position:absolute;top:8px;right:10px;width:30px;height:30px;border:0;background:none;color:var(--hero-ink);opacity:.7;font:400 22px/1 Inter,system-ui,sans-serif;cursor:pointer}
.rw{font:700 17px "Playfair Display",Georgia,serif;color:#e6c88f;overflow-wrap:anywhere}
.rt{font-size:15px;margin:4px 0 10px;min-height:22px;overflow-wrap:anywhere}
.rbtns{display:flex;gap:8px}.rbtns .rbtn{flex:1}
.rbtn{width:100%;border:0;border-radius:9px;padding:8px 12px;background:#e6c88f;color:#0b1f3a;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.rbtn[disabled]{opacity:.8;cursor:default}
.rbtn.ghost{background:none;color:#e6c88f;border:1px solid rgba(230,200,143,.5)}
.exp{display:block;width:100%;font:inherit;font-size:15px;line-height:1.6;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical}
.exp:focus{outline:2px solid var(--gold);outline-offset:1px}
.ins h4{font:700 17px "Playfair Display",Georgia,serif;margin:20px 0 0}
.ins h4:first-child{margin-top:12px}
.note{border-left:3px solid var(--gold);background:rgba(168,132,74,.1);border-radius:0 12px 12px 0;padding:2px 16px 12px;margin:12px 0 0}
.note p:first-child{font-weight:600}
.disc{font-size:13px;margin:16px 0 0}
.alert{display:flex;align-items:center;flex-wrap:wrap;gap:14px;background:var(--hero);color:var(--hero-ink);border:1.5px solid #e6c88f;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 8px 26px rgba(168,132,74,.28)}
.alert .ico{flex:none;width:36px;height:36px;border-radius:50%;background:#e6c88f;color:#0b1f3a;font:700 18px "Playfair Display",Georgia,serif;display:flex;align-items:center;justify-content:center}
.alert .msg{flex:1 1 220px;min-width:0;font-size:15px;line-height:1.45}
.alert .msg b{display:block;font:600 12px Inter,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#e6c88f;margin-bottom:3px}
.abtn{border:0;border-radius:10px;padding:9px 16px;background:#e6c88f;color:#0b1f3a;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.alert.soft{background:rgba(168,132,74,.14);color:var(--ink);border-color:var(--gold);box-shadow:none}
.alert.soft .ico{background:var(--gold);color:var(--card)}
.alert.soft .msg b{color:var(--gold)}
.alert.soft .abtn{background:var(--hero);color:var(--hero-ink)}
.alert.done{border-color:var(--ok);box-shadow:none}
.alert.done .ico{background:var(--ok);color:var(--card)}
.alert.done .msg b{color:#8fd9b6}
.alert.soft.done .msg b{color:var(--ok)}
.gear{flex:none;width:32px;height:32px;margin:-2px 0 0 0;padding:0;border:0;background:none;color:var(--mute);border-radius:8px;font:700 20px/1 Inter,system-ui,sans-serif;cursor:pointer;opacity:.75}
.gear:hover,.gear.on{opacity:1;color:var(--ink);background:rgba(168,132,74,.16)}
.addrow .gear{margin:0}
.panel{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);max-width:100%}
.panel .txt{background:var(--card)}
.feature .panel{color:var(--ink)}
.feature .gear{color:var(--hero-ink)}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lnk:disabled{opacity:.32;cursor:default}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-head>.grow{flex:1 1 0%;min-width:0}
.rem-row{padding:14px 0;border-top:1px solid var(--line)}
.rem-row.first{border-top:0}
.rem-body{border-left:3px solid var(--gold);padding:2px 0 2px 14px;min-width:0}
.rem-row.pinned .rem-body{border-left-width:4px;background:rgba(168,132,74,.06);border-radius:0 10px 10px 0;padding:8px 12px 8px 14px}
.rem-text{font:600 16px/1.55 "Playfair Display",Georgia,serif;color:var(--ink);overflow-wrap:anywhere}
.rem-note{font-size:13.5px;color:var(--mute);margin-top:4px;line-height:1.45;overflow-wrap:anywhere}
.rem-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.pin-badge{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-ink);background:var(--gold);padding:2px 7px;border-radius:5px;display:inline-block}
.tab.ws-btn{flex:0 0 auto;padding:10px 12px;font-size:15px;line-height:1;opacity:.8}
.tab.ws-btn[aria-expanded=true]{background:var(--hero);color:var(--hero-ink);opacity:1}
.ws-card{border:1.5px solid var(--gold);background:var(--card)}
.ws-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.ws-item{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);max-width:100%}
.ws-item.is-hidden{opacity:.58}
.ws-item .txt{flex:1 1 140px;min-width:0;max-width:100%;padding:6px 10px;font-size:14px;background:var(--card)}
.sec-bar{display:flex;justify-content:center;gap:14px;margin:6px 0 16px;flex-wrap:wrap}
.sec-btn{background:none;border:1px dashed var(--line);color:var(--mute);border-radius:10px;padding:7px 14px;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;transition:all .2s}
.sec-btn:hover{border-color:var(--gold);color:var(--gold)}
.advrow{display:flex;flex-wrap:wrap;gap:10px 12px;margin:10px 0 0;max-width:100%}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:600;min-width:0;flex:1 1 180px;max-width:100%}
.fl.wide{flex:1 1 100%}
.fl .txt{flex:none;width:100%;max-width:100%}
.fl .chips{margin:0}
.chip.day{padding:5px 10px;min-width:46px;text-align:center}
.err{color:var(--bad);margin:8px 0 0}
.sprint{background:var(--card);border:1px solid var(--gold);border-top:5px solid var(--gold);border-radius:18px;padding:28px 26px;box-shadow:0 16px 40px rgba(10,20,35,.08);position:relative;overflow:hidden;max-width:100%}
.sprint::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:18px;background:linear-gradient(180deg, rgba(168,132,74,.05) 0%, transparent 100%);pointer-events:none}
.sprint-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;margin-bottom:14px;border-bottom:1px solid var(--line);position:relative;z-index:1}
.sprint-head>.grow{flex:1 1 260px;min-width:0}
.sprint-ctrl{display:flex;align-items:flex-start;gap:10px;flex:0 0 auto;max-width:100%}
.subtasks{margin:6px 0 2px 4px;padding-left:clamp(10px,2.2vw,14px);border-left:1.5px dashed rgba(168,132,74,.35);max-width:100%}
.subtask-node{margin-top:8px;max-width:100%}
.subtask-row{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.subtask-row .chk{width:20px;height:20px;border-width:1.5px;margin-top:2px}
.subtask-row .chk:checked::after{left:6px;top:-4px;width:6px;height:16px;border-width:0 2px 2px 0}
.subtask-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px}
.chev{background:none;border:0;color:var(--gold);font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:4px}
.chev:hover{opacity:.8}
.sub-add-btn{flex:none;width:28px;height:28px;margin:-1px 0 0 0;padding:0;border:1px solid transparent;background:none;color:var(--gold);border-radius:8px;font:500 18px/1 Inter,system-ui,sans-serif;cursor:pointer;opacity:.75;display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.sub-add-btn:hover,.sub-add-btn.on{opacity:1;color:var(--gold);border-color:rgba(168,132,74,.4);background:rgba(168,132,74,.14)}
.sub-inline-form{margin-top:8px;padding:8px 10px;border:1px dashed rgba(168,132,74,.4);border-radius:10px;background:var(--bg);max-width:100%}
.sub-inline-form .txt{background:var(--card);padding:7px 10px;font-size:14px}
.sprint h2{font-size:28px;letter-spacing:-.01em;margin-bottom:6px}
.sprint-sub{color:var(--mute);font-size:14.5px;line-height:1.55;max-width:520px;margin:0;overflow-wrap:break-word}
.sprint-dl{border:1.5px solid var(--gold);background:var(--bg);border-radius:12px;padding:10px 16px;text-align:right;flex:none;max-width:100%}
.sprint-dl b{display:block;font:700 15px "Playfair Display",Georgia,serif;color:var(--ink)}
.sprint-dl span{display:block;font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.sprint .row{padding:14px 0}
.sprint .iform{margin-top:14px;padding-top:6px}
.arch-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.arch-head>.grow{flex:1 1 200px;min-width:0}
.arch-mark{width:20px;height:20px;margin-top:2px;flex:none;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mute)}

function coerceValue(val, def){
  if(val===null||val===undefined)return def;
  if(Array.isArray(def)){
    if(Array.isArray(val))return val;
    if(typeof val==="object"){
      const keys=Object.keys(val);
      if(keys.length>0&&keys.every(k=>/^\d+$/.test(k))){
        return keys.sort((a,b)=>Number(a)-Number(b)).map(k=>val[k]);
      }
    }
    return def;
  }
  if(def&&typeof def==="object"){
    return (typeof val==="object"&&!Array.isArray(val))?val:def;
  }
  return val;
}

function cleanForFirebase(val){
  if(val===undefined)return null;
  try{return JSON.parse(JSON.stringify(val))}catch(e){return val}
}

const store={
  get(k,d){try{const v=localStorage.getItem(k);if(v===null)return d;return coerceValue(JSON.parse(v),d)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  markDirty(k){
    try{
      const cur=JSON.parse(localStorage.getItem("pd.__dirty_keys")||"[]");
      if(!cur.includes(k)){cur.push(k);localStorage.setItem("pd.__dirty_keys",JSON.stringify(cur));}
    }catch(e){}
  },
  clearDirty(k){
    try{
      const cur=JSON.parse(localStorage.getItem("pd.__dirty_keys")||"[]").filter(x=>x!==k);
      localStorage.setItem("pd.__dirty_keys",JSON.stringify(cur));
    }catch(e){}
  },
  getDirty(){
    try{return JSON.parse(localStorage.getItem("pd.__dirty_keys")||"[]")}catch(e){return[]}
  }
};

const toDbPath = k => "al_qudwah_dashboard/" + String(k).replace(/[.$/#[\]]/g, "_");

function pushKeyToFirebase(k, val){
  if(!rtdb) return Promise.resolve();
  const safeNext = cleanForFirebase(val);
  const isEmptyArr = Array.isArray(safeNext) && safeNext.length === 0;
  const isEmptyObj = safeNext && typeof safeNext === "object" && !Array.isArray(safeNext) && Object.keys(safeNext).length === 0;
  return rtdb.ref(toDbPath(k)).set({
    _data: (isEmptyArr || isEmptyObj) ? null : safeNext,
    _empty: isEmptyArr ? "array" : isEmptyObj ? "object" : null,
    _updatedAt: Date.now()
  }).then(() => {
    store.clearDirty(k);
  });
}

function flushDirtyKeysToFirebase(){
  if(!rtdb || navigator.onLine === false) return;
  const dirty = store.getDirty();
  dirty.forEach(k => {
    try {
      const raw = localStorage.getItem(k);
      if(raw !== null){
        pushKeyToFirebase(k, JSON.parse(raw)).catch(()=>{});
      } else {
        store.clearDirty(k);
      }
    } catch(e){}
  });
}

window.addEventListener("online", flushDirtyKeysToFirebase);

function useStored(k, d){
  const [state, setState] = useState(() => store.get(k, d));
  const stateRef = useRef(state);
  stateRef.current = state;

  useEffect(() => {
    if (!rtdb) return;
    const dbRef = rtdb.ref(toDbPath(k));
    const handleSnapshot = (snapshot) => {
      if (store.getDirty().includes(k)) {
        pushKeyToFirebase(k, store.get(k, d)).catch(()=>{});
        return;
      }
      if (snapshot.exists()) {
        const raw = snapshot.val();
        let nextVal;
        if (raw && typeof raw === "object" && ("_data" in raw || "_empty" in raw)) {
          nextVal = raw._empty === "array" ? [] : raw._empty === "object" ? {} : raw._data;
        } else {
          nextVal = raw;
        }
        if (nextVal !== undefined) {
          const coerced = coerceValue(nextVal, d);
          stateRef.current = coerced;
          setState(coerced);
          store.set(k, coerced);
        }
      } else {
        const initial = cleanForFirebase(store.get(k, d));
        pushKeyToFirebase(k, initial).catch(() => {});
      }
    };
    dbRef.on("value", handleSnapshot, (err) => {
      console.warn("Firebase read error for " + k + ":", err);
    });
    return () => dbRef.off("value", handleSnapshot);
  }, [k]);

  const setStoredValue = useCallback((updater) => {
    setState((prev) => {
      const rawNext = typeof updater === "function" ? updater(prev) : updater;
      const next = coerceValue(rawNext, d);
      stateRef.current = next;
      store.set(k, next);
      if (rtdb) {
        if (navigator.onLine === false) {
          store.markDirty(k);
        } else {
          pushKeyToFirebase(k, next).catch(() => {
            store.markDirty(k);
          });
        }
      }
      return next;
    });
  }, [k]);

  return [state, setStoredValue];
}

function parseInlineTokens(str, keyPrefix="t"){
  if(!str)return[];
  const out=[];
  const tokenRe=/\{\{(.+?)\|(.+?)(?:\|(.+?))?\}\}|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|\*\*([^*]+)\*\*|\*([^*]+)\*|(?:^|\s)(#[A-Za-z0-9_\u0400-\u04FF-]+)/g;
  let last=0,m,idx=0;
  while((m=tokenRe.exec(str))){
    let matchStart=m.index;
    let rawMatch=m[0];
    if(m[8] && rawMatch[0]!== "#"){
      matchStart+=rawMatch.length-m[8].length;
    }
    if(matchStart>last){
      out.push(str.slice(last,matchStart));
    }
    const k=keyPrefix+"-"+(idx++);
    if(m[1]!==undefined){
      out.push(h(Hint,{key:k,tr:m[2],note:m[3]||""},parseInlineTokens(m[1],k+"-h")));
    }else if(m[4]!==undefined){
      out.push(h("a",{key:k,className:"md-link",href:m[5],target:"_blank",rel:"noopener noreferrer",onClick:e=>e.stopPropagation()},parseInlineTokens(m[4],k+"-a")));
    }else if(m[6]!==undefined){
      out.push(h("strong",{key:k},parseInlineTokens(m[6],k+"-b")));
    }else if(m[7]!==undefined){
      out.push(h("em",{key:k},parseInlineTokens(m[7],k+"-i")));
    }else if(m[8]!==undefined){
      const tagClean=m[8].slice(1).toLowerCase();
      out.push(h("button",{
        key:k,
        type:"button",
        className:"inline-tag",
        title:"Filter by #"+tagClean,
        onClick:e=>{
          e.stopPropagation();
          if(globalTagClickHandler)globalTagClickHandler(tagClean);
        }
      },m[8]));
    }
    last=tokenRe.lastIndex;
  }
  if(last<str.length)out.push(str.slice(last));
  return out;
}

function rich(s){
  const str=String(s==null?"":s);
  if(!str)return null;
  if(!str.includes("\n") && !str.trimStart().startsWith(">")){
    return parseInlineTokens(str,"r");
  }
  const lines=str.split("\n");
  return lines.map((line,i)=>{
    const trimmed=line.trimStart();
    if(trimmed.startsWith(">")){
      const quoteBody=trimmed.replace(/^>\s?/,"");
      return h("blockquote",{key:"bq-"+i,className:"md-quote"},parseInlineTokens(quoteBody,"bq-"+i));
    }
    return h(React.Fragment,{key:"ln-"+i},
      i>0&&!lines[i-1].trimStart().startsWith(">")?h("br"):null,
      parseInlineTokens(line,"ln-"+i)
    );
  });
}

    }
    if(popRef.current&&cur.current&&cur.current.word===pk.word&&cur.current.sentence===pk.sentence)return;
    const sheet=isMobileSheet();
    sheetRef.current=sheet;
    const rc=pk.rect,w=Math.min(280,window.innerWidth-24),x=Math.max(12,Math.min((rc.left+rc.right)/2-w/2,window.innerWidth-w-12)),below=rc.bottom+190<window.innerHeight;

function normalizeLayout(rawLayout, tabsConfig, customTabsData){
  const base=(rawLayout&&typeof rawLayout==="object"&&!Array.isArray(rawLayout))?{...rawLayout}:{};
  Object.keys(DEFAULT_LAYOUT).forEach(tabId=>{
    if(!Array.isArray(base[tabId])){
      base[tabId]=DEFAULT_LAYOUT[tabId].map(w=>({...w}));
    }
  });
  (Array.isArray(tabsConfig)?tabsConfig:[]).forEach(tab=>{
    if(!Array.isArray(base[tab.id])){
      const legacySecs=customTabsData&&Array.isArray(customTabsData[tab.id])?customTabsData[tab.id]:null;
      if(legacySecs&&legacySecs.length){
        base[tab.id]=legacySecs.map((sec,idx)=>({
          id:sec.id||("w-mig-"+tab.id+"-"+idx),
          type:sec.type==="notes"?"custom_notes":sec.type==="topics"?"custom_topics":"custom_checklist",
          legacyTabId:tab.id,
          legacySecId:sec.id
        }));
      }else{
        const tpl=tab.template==="notes"?"custom_notes":tab.template==="topics"?"custom_topics":"custom_checklist";
        base[tab.id]=[{
          id:"w-init-"+tab.id,
          type:tpl,
          eyebrow:tpl==="custom_notes"?"Principles & Notes":tpl==="custom_topics"?"Knowledge Base":"Custom List",
          title:tab.title
        }];
      }
    }
  });
  return base;
}

function normalizeTabs(raw){
  if(!Array.isArray(raw)||!raw.length)return DEFAULT_TABS;
  const list=raw.map(x=>{
    if(Array.isArray(x))return{id:String(x[0]),title:String(x[1]),builtin:true,hidden:false};
    if(x&&typeof x==="object"&&x.id)return{
      id:String(x.id),
      title:String(x.title||x.id),
      builtin:!!x.builtin,
      hidden:!!x.hidden,
      template:x.template||"checklist"
    };
    return null;
  }).filter(Boolean);
  DEFAULT_TABS.forEach((def,idx)=>{
    if(!list.some(t=>t.id===def.id)){
      const insertAt=Math.min(idx,list.length);
      list.splice(insertAt,0,{...def});
    }
  });
  return list;
}

function moveInList(fullList,visibleList,itemId,dir){
  const vIdx=visibleList.findIndex(x=>x&&x.id===itemId);
  const targetIdx=vIdx+dir;
  if(vIdx<0||targetIdx<0||targetIdx>=visibleList.length)return fullList;
  const aId=visibleList[vIdx].id,bId=visibleList[targetIdx].id;
  const next=fullList.slice();
  const iA=next.findIndex(x=>x&&x.id===aId),iB=next.findIndex(x=>x&&x.id===bId);
  if(iA<0||iB<0)return fullList;
  const tmp=next[iA];next[iA]=next[iB];next[iB]=tmp;
  return next;
}

function moveIdx(arr,idx,dir){
  const t=idx+dir;
  if(!Array.isArray(arr)||idx<0||t<0||t>=arr.length)return arr;
  const next=arr.slice();
  const tmp=next[idx];next[idx]=next[t];next[t]=tmp;
  return next;
}

    if(!cd)return;
    const t=setTimeout(()=>setCd(false),3000);
    return()=>clearTimeout(t);
  },[cd]);

  const children=normalizeSubtasks(sub.subtasks);
  const stats=countSubtree(children);

  const handleAddChild=v=>{
    const nextChildren=[...children,{id:uid(),t:v.t.trim(),done:false,subtasks:[]}];
    onUpdate({...sub,subtasks:nextChildren});
    setAddingSub(false);
    setOpenSub(true);

  return h("div",{className:"subtask-node"},
    h("div",{className:"subtask-row"+(sub.done?" done":"")},
      h("input",{

        "aria-label":"Subtask done",
        onChange:()=>onUpdate({...sub,done:!sub.done})
      }),
      h("div",{className:"grow"},
        h("div",{className:"tdrow"},
          h("div",{className:"t",style:{fontSize:"14.5px",lineHeight:"1.45"}},rich(sub.t)),
          editMode&&h("div",{className:"acts"},
            h("button",{
              type:"button",
              className:"sub-add-btn"+(addingSub?" on":""),
              style:{width:"24px",height:"24px",fontSize:"16px"},
              "aria-label":"Add nested subtask",
              "aria-expanded":addingSub,
              title:"Add nested subtask",
              onClick:()=>setAddingSub(!addingSub)
            },"+"),
            h("button",{
              type:"button",
              className:"gear"+(openMenu?" on":""),
              style:{width:"26px",height:"26px",fontSize:"16px"},
              "aria-label":"Subtask options",

            openSub
              ?"\u25B2 Hide subtasks ("+stats.directDone+"/"+stats.directTotal+(stats.total>stats.directTotal?" \u00b7 "+stats.done+"/"+stats.total+" total":"")+")"
              :"\u25BC "+stats.directDone+"/"+stats.directTotal+" subtask"+(stats.directTotal===1?"":"s")+(stats.total>stats.directTotal?" ("+stats.done+"/"+stats.total+" total)":"")

            ),

          )

function RecursiveSubtaskList({subtasks,depth=1,onChange}){
  const list=normalizeSubtasks(subtasks);
  if(!list.length)return null;

  const updateAt=(idx,nextNode)=>{
    const copy=list.slice();
    copy[idx]=nextNode;
    onChange(copy);
  };
  const deleteAt=idx=>{
    onChange(list.filter((_,i)=>i!==idx));
  };
  const moveAt=(idx,dir)=>{
    onChange(moveIdx(list,idx,dir));
  };

  return h("div",{className:"subtasks",style:depth>3?{paddingLeft:"8px",marginLeft:"2px"}:undefined},
    list.map((s,idx)=>h(RecursiveSubtaskNode,{
      key:s.id||idx,
      sub:s,
      depth,
      onUpdate:nextNode=>updateAt(idx,nextNode),
      onDelete:()=>deleteAt(idx),
      onMoveUp:idx>0?()=>moveAt(idx,-1):null,
      onMoveDown:idx<list.length-1?()=>moveAt(idx,1):null
    }))
  );
}

function WorkspaceManager({tabs,setTabs,activeTab,setActiveTab,layoutEditMode,setLayoutEditMode,allTags,tagFlt,setTagFlt,onResetLayout,onDeleteCustomTabData,onClose}){
  const[newTitle,setNewTitle]=useState("");
  const[newTpl,setNewTpl]=useState("checklist");

  useEffect(()=>{
    if(!confirmId)return;
    const t=setTimeout(()=>setConfirmId(null),3000);
    return()=>clearTimeout(t);
  },[confirmId]);

  const visibleCount=tabs.filter(t=>!t.hidden).length;

  const renameTab=(id,title)=>setTabs(tabs.map(t=>t.id===id?{...t,title}:t));
  const toggleHide=id=>{
    const target=tabs.find(t=>t.id===id);
    if(!target)return;
    if(!target.hidden&&visibleCount<=1)return;
    const next=tabs.map(t=>t.id===id?{...t,hidden:!t.hidden}:t);
    setTabs(next);
    if(activeTab===id&&!target.hidden){
      const firstVis=next.find(t=>!t.hidden);
      if(firstVis)setActiveTab(firstVis.id);
    }
  };
  const moveTab=(idx,dir)=>setTabs(moveIdx(tabs,idx,dir));

  useEffect(()=>{if(!cd)return;const t=setTimeout(()=>setCd(false),3000);return()=>clearTimeout(t)},[cd]);

  const items=Array.isArray(course.m)?course.m:[];
  const doneCount=items.filter((_,i)=>ms[i]).length;

  const updateMilestone=(idx,val)=>{
    const next=items.slice();
    next[idx]=val;
    onUpdateCourse({...course,m:next});
  };
  const deleteMilestone=idx=>{

  const moveMilestone=(idx,dir)=>{

  return h("section",{className:"card"},

      )

    items.map((m,i)=>h(Row,{

        onResetLayout:()=>setRawLayout(DEFAULT_LAYOUT),
        onDeleteCustomTabData:id=>{
          setCustomTabsData(prev=>{const next={...(prev||{})};delete next[id];return next});
          setRawLayout(prev=>{const next={...(prev||{})};delete next[id];return next});
        },
        onClose:()=>setWsOpen(false)
      }),
      h("main",null,renderActiveTab()),
      h("p",{className:"foot"},"Tip: use **bold**, *italic*, > quotes, [links](https://...), or #tags anywhere. Highlight words in the Morning Brief to translate.")
    )
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
}
startDashboard();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/sw.js").catch(function(err) {
      console.warn("Service Worker registration failed:", err);
    });
  });
}
</script>
